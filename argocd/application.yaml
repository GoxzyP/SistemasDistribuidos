# Applied ONCE by hand (kubectl apply -f argocd/application.yaml).
# From then on Argo CD watches the k8s/ folder of the Git repository and keeps
# the cluster in sync with it: no more `kubectl apply`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ticketmei
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/GoxzyP/SistemasDistribuidos.git
    targetRevision: parte3 
    path: k8s                
  destination:
    server: https://kubernetes.default.svc
    namespace: ticketmei
  syncPolicy:
    automated:
      prune: true      
      selfHeal: true   
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
