networks:
  ticketmei-net:
    driver: bridge

services:
  catalog:
    build: ./catalog
    container_name: catalog
    ports:
      - "8001:8001"
    networks:
      - ticketmei-net

  order:
    build: ./order
    container_name: order
    environment:
      CATALOG_URL: http://catalog:8001
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "8002:8002"
    depends_on:
      catalog:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - ticketmei-net

  notification:
    build: ./notification
    container_name: notification
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "8003:8003"
    volumes:
      # The delivery log (notification_logs.json) also appears on the host
      - ./notification/logs:/app/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ticketmei-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"     # AMQP (used by the services)
      - "15672:15672"   # management UI (guest / guest)
      - "15692:15692"   # Prometheus metrics (queue size, etc.)
    volumes:
      # Enables the management UI and the Prometheus plugin
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ticketmei-net

  redis:
    image: redis:7-alpine
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ticketmei-net

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    environment:
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_MAX: "5"
      RATE_LIMIT_WINDOW_MS: "1000"
    ports:
      - "8000:8000"
    depends_on:
      - catalog
      - order
      - redis
    networks:
      - ticketmei-net

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - ticketmei-net

  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - ticketmei-net

  k6:
    image: grafana/k6:0.49.0
    container_name: k6
    user: root
    working_dir: /ci-scripts
    volumes:
      - ./k6:/ci-scripts
    command: run load-test.js
    depends_on:
      - api-gateway
    networks:
      - ticketmei-net
    profiles:
      - testing