apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketmei
spec:
  # Confirm the class with `kubectl get ingressclass` (or ask the teacher).
  ingressClassName: nginx
  rules:
    - host: ticketmei-grupo01.10.2.15.161.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
