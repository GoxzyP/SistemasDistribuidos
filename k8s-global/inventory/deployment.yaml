apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  labels:
    app: inventory
spec:
  replicas: 1
  # The namespace quota has no room for a second pod during an update: stop the old pod first.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inventory
          # The tag is updated automatically by the CI/CD pipeline (Git SHA).
          image: ghcr.io/goxzyp/sistemasdistribuidos/inventory:680cbbe70434b735353dad8c7f261da7b0273760
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8005
          env:
            - name: INITIAL_STOCK
              value: '{"evt-101":60000,"evt-102":50000,"evt-103":55000,"evt-104":1}'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8005
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8005
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
