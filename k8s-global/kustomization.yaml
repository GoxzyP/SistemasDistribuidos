# Entry point for Argo CD on the UMa (global) cluster: path k8s-global.
# The local cluster keeps using the k8s/ folder.
# Differences from k8s/: namespace grupo01, PSA "restricted" security contexts, RabbitMQ of the
# cluster (credentials from the pre-created Secret), no own Prometheus / Grafana / RabbitMQ
# (ServiceMonitors + NetworkPolicies instead), Ingress instead of LoadBalancer.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: grupo01

resources:
  - redis/deployment.yaml
  - redis/service.yaml
  - catalog/deployment.yaml
  - catalog/service.yaml
  - payment/deployment.yaml
  - payment/service.yaml
  - inventory/deployment.yaml
  - inventory/service.yaml
  - order/deployment.yaml
  - order/service.yaml
  - notification/deployment.yaml
  - notification/service.yaml
  - api-gateway/deployment.yaml
  - api-gateway/service.yaml
  - ingress.yaml
  - monitoring/servicemonitors.yaml
  - monitoring/networkpolicies.yaml
