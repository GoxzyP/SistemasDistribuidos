apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  labels:
    app: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notification
          # The tag is updated automatically by the CI/CD pipeline (Git SHA).
          image: ghcr.io/goxzyp/sistemasdistribuidos/notification:697c814a33615faaa775cf98115ac4d0b6711880
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: grupo01-user-user-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grupo01-user-user-credentials
                  key: password
            # $(VAR) is expanded by Kubernetes, so these two must come first.
            # The vhost "/grupo01" is URL-encoded as %2Fgrupo01.
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq.rabbitmq-system.svc.cluster.local:5672/%2Fgrupo01
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: logs
              mountPath: /app/logs
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8003
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: logs
          emptyDir: {}
