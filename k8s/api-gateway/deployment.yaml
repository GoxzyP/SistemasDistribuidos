apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      # Services are reached through DNS (catalog, order, rabbitmq, ...), so the
      # legacy *_PORT variables that Kubernetes injects are not needed.
      enableServiceLinks: false
      containers:
        - name: api-gateway
          # The tag is updated automatically by the CI/CD pipeline (Git SHA).
          image: ghcr.io/goxzyp/sistemasdistribuidos/api-gateway:5508138a37244332d930300fb7a785e63e539795
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: CATALOG_URL
              value: http://catalog:8001
            - name: ORDER_URL
              value: http://order:8002
            - name: REDIS_URL
              value: redis://redis:6379
            - name: RATE_LIMIT_MAX
              value: "5"
            - name: RATE_LIMIT_WINDOW_MS
              value: "1000"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
