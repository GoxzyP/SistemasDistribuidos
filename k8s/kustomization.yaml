# Entry point for Argo CD (path: k8s) and for `kubectl apply -k k8s`.
# Kustomize generates the ConfigMaps from the files below; when one of those
# files changes, the ConfigMap name changes too and the Deployment that uses it
# is restarted automatically.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ticketmei

resources:
  - namespace.yaml
  - catalog/deployment.yaml
  - catalog/service.yaml
  - order/deployment.yaml
  - order/service.yaml
  - notification/deployment.yaml
  - notification/service.yaml
  - api-gateway/deployment.yaml
  - api-gateway/service.yaml
  - redis/deployment.yaml
  - redis/service.yaml
  - rabbitmq/deployment.yaml
  - rabbitmq/service.yaml
  - prometheus/deployment.yaml
  - prometheus/service.yaml
  - grafana/deployment.yaml
  - grafana/service.yaml

configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus/prometheus.yml
  - name: rabbitmq-plugins
    files:
      - rabbitmq/enabled_plugins
  - name: grafana-datasources
    files:
      - grafana/provisioning/datasources/datasource.yml
  - name: grafana-dashboard-providers
    files:
      - grafana/provisioning/dashboards/dashboards.yml
  - name: grafana-dashboards
    files:
      - grafana/dashboards/dashboard-gateway-catalog.json
      - grafana/dashboards/dashboard-order-notification.json
      - grafana/dashboards/rabbitmq-overview.json
