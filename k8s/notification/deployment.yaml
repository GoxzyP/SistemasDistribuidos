apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  labels:
    app: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      enableServiceLinks: false
      containers:
        - name: notification
          image: ghcr.io/goxzyp/sistemasdistribuidos/notification:697c814a33615faaa775cf98115ac4d0b6711880
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
          env:
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
          volumeMounts:
            - name: logs
              mountPath: /app/logs
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8003
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: logs
          emptyDir: {}
