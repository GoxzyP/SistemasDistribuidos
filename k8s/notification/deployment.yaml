apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  labels:
    app: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      # Services are reached through DNS (catalog, order, rabbitmq, ...), so the
      # legacy *_PORT variables that Kubernetes injects are not needed.
      enableServiceLinks: false
      containers:
        - name: notification
          # The tag is updated automatically by the CI/CD pipeline (Git SHA).
          image: ghcr.io/goxzyp/sistemasdistribuidos/notification:ffe7686a0a5b972d932b4eed2a4d72814781690a
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
          env:
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
          volumeMounts:
            - name: logs
              mountPath: /app/logs
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8003
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        # The delivery log (notification_logs.json) lives as long as the pod
        - name: logs
          emptyDir: {}
