apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  labels:
    app: order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      enableServiceLinks: false
      containers:
        - name: order
          image: ghcr.io/goxzyp/sistemasdistribuidos/order:697c814a33615faaa775cf98115ac4d0b6711880
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: CATALOG_URL
              value: http://catalog:8001
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
            - name: PAYMENT_URL
              value: http://payment:8004
            - name: INVENTORY_URL
              value: http://inventory:8005
            - name: PAYMENT_TIMEOUT_MS
              value: "1000"
            - name: PAYMENT_MAX_ATTEMPTS
              value: "3"
            - name: PAYMENT_RETRY_BASE_MS
              value: "100"
            - name: PAYMENT_RETRY_MAX_MS
              value: "500"
            - name: CB_WINDOW_SIZE
              value: "10"
            - name: CB_MIN_CALLS
              value: "5"
            - name: CB_FAILURE_RATE
              value: "0.5"
            - name: CB_OPEN_MS
              value: "10000"
            - name: CB_HALF_OPEN_CALLS
              value: "1"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8002
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
