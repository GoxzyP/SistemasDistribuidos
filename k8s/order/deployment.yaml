apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  labels:
    app: order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      # Services are reached through DNS (catalog, order, rabbitmq, ...), so the
      # legacy *_PORT variables that Kubernetes injects are not needed.
      enableServiceLinks: false
      containers:
        - name: order
          # The tag is updated automatically by the CI/CD pipeline (Git SHA).
          image: ghcr.io/goxzyp/sistemasdistribuidos/order:5508138a37244332d930300fb7a785e63e539795
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: CATALOG_URL
              value: http://catalog:8001
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8002
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
