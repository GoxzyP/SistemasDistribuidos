apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  labels:
    app: order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      enableServiceLinks: false
      containers:
        - name: order
          image: ghcr.io/goxzyp/sistemasdistribuidos/order:ffe7686a0a5b972d932b4eed2a4d72814781690a
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: CATALOG_URL
              value: http://catalog:8001
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8002
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
